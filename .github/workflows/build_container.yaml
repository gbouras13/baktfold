name: Build and Push Container to Quay
on: [push,pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        # The ROCm PyTorch base image is large enough to exhaust the default
        # runner disk ("no space left on device"); drop preinstalled SDKs we
        # never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Log in to Quay
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          IMAGE=quay.io/${{ secrets.QUAY_USERNAME }}/baktfold:${{ github.sha }}
          docker build --build-arg BAKTFOLD_REF=${{ github.sha }} -f container/hpci/Dockerfile -t $IMAGE .

      - name: Push Docker image
        run: |
          IMAGE=quay.io/${{ secrets.QUAY_USERNAME }}/baktfold:${{ github.sha }}
          docker push $IMAGE
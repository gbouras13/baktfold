name: HPCTest
on: [push,pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this commit's container image
        # The image is built by build_container.yaml, a separate workflow
        # started by the same push. The Setonix job pulls it, so do not
        # schedule until the tag exists (builds can take >15 min, which used
        # to lose the race against --begin=now+15minutes).
        run: |
          for i in $(seq 1 90); do
            if curl -sf "https://quay.io/api/v1/repository/${{ secrets.QUAY_USERNAME }}/baktfold/tag/?specificTag=${{ github.sha }}" \
                 | grep -q '"name": *"${{ github.sha }}"'; then
              echo "image tag found"; exit 0
            fi
            sleep 60
          done
          echo "container image for ${{ github.sha }} not found after 90 min (did the build fail?)"; exit 1

      - name: Download, Setup, and Run hpci
        env:
          KEY: ${{ secrets.PRIVATE_KEY }}
          PUB: ${{ secrets.PUBLIC_KEY }}
        run: |
          wget -qO hpci-exe https://github.com/Garvan-Data-Science-Platform/hpci/releases/download/v0.1.3/hpci-exe
          chmod +x ./hpci-exe
          ./hpci-exe --help

          echo "$KEY" > key
          echo "$PUB" > key.pub
          chmod 400 key*

          ./hpci-exe \
            --user ${{ secrets.PAWSEY_USER }} \
            --host ${{ secrets.PAWSEY_HOST }} \
            --port 22 \
            --publicKey key.pub \
            --privateKey key \
            schedule \
            --scheduler slurm \
            --script ci/test_job.slurm \
            --logFile baktfold-${{ github.sha }}.out \
            --scheduler-arg --account=${{ secrets.PAWSEY_ACCOUNT }}-gpu \
            --scheduler-arg --output=baktfold-${{ github.sha }}.out \
            --scheduler-arg --begin=now+15minutes \
            -c BASEDIR=${{ secrets.BASEDIR }},COMMIT_SHA=${{ github.sha }},REPO_URL=https://github.com/${{ github.repository }}.git,REPO_NAME=${{ github.event.repository.name }}

      - name: Cleanup keys and binary
        if: always()
        run: rm -f ./hpci-exe key key.pub


